name: Release

# Started by hand from the Actions tab, on main. The version comes from
# pubspec.yaml, which the release pull request bumps along with CHANGELOG.md.
#
# A tag is not the trigger, it is the result. pub.dev keeps every published
# version, so the tag must not exist until the checks have passed.
#
# Pushing the tag starts publish.yml, because pub.dev only accepts a publish
# from a workflow started by a tag push. A tag pushed with GITHUB_TOKEN starts
# no workflows, so this job pushes with a deploy key instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Ahead of verify so a dispatch from the wrong ref fails in seconds rather
  # than after the tests.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatched from main
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "${REF}" != "main" ]; then
            echo "::error::Release must be run on main; this run is on ${REF}."
            exit 1
          fi

      # Without the key, checkout falls back to GITHUB_TOKEN and the tag push
      # would never start publish.yml.
      - name: Deploy key is set
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "${KEY}" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is not set; the tag push would not start publish.yml"
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/test.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: dart-lang/setup-dart@v1

      - name: Work out the version
        id: target
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml version '${version}' is not a plain X.Y.Z"
            exit 1
          fi

          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "::error::v${version} is already tagged; bump pubspec.yaml in a release pull request"
            exit 1
          fi

          # The release notes are the CHANGELOG.md section for this version.
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no entry for ${version}"
            exit 1
          fi

          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the package
        run: |
          dart pub get
          dart pub publish --dry-run

      # Everything above this line is a check. The tag is the publish.
      - name: Tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
